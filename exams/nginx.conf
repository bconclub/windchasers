# Sample Nginx server block for exams.windchasers.in
# Install to /etc/nginx/sites-available/exams.windchasers.in and symlink into
# sites-enabled, then run certbot to add the TLS block.
#
#   sudo ln -s /etc/nginx/sites-available/exams.windchasers.in /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d exams.windchasers.in

server {
    listen 80;
    listen [::]:80;
    server_name exams.windchasers.in;

    # Certbot rewrites this block to redirect to 443 after issuing the cert
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Next static assets are content hashed, cache them hard
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Excel and CSV uploads for the question import
    client_max_body_size 25M;

    # This is an internal tool, keep it out of search results
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    access_log /var/log/nginx/exams.windchasers.in.access.log;
    error_log /var/log/nginx/exams.windchasers.in.error.log;
}
